apiVersion: apps/v1
kind: Deployment
metadata:
  name: mars-gateway-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mars-gateway
  template:
    metadata:
      labels:
        app: mars-gateway
    spec:
      containers:
      - name: gateway
        image: earth-mars/backend:latest
        ports:
        - containerPort: 4000
